const chapters = [
  {
    nav: "I · Beginning",
    part: "Part Zero",
    title: "A New Beginning",
    content: `
<div class="body-text">
<p>In the beginning, there was Nothingness.</p>
<p>And with Nothingness, there was Them.</p>
<p>And the Nothingness was Them.</p>
<p>Their light shone within the endless dark, and the darkness could not overcome it.</p>
<p>But then — there was fire.</p>
<p>A flame that pierced through their radiance.</p>
<p>Surprise was a mortal emotion, and They were not mortal. To Them, this was inevitable.</p>
<p>And yet… it stirred their curiosity.</p>
<p>On his throne They sat, Their voice shaked nothingness, a new life was made.</p>
<div class="decree">"I am the hand that births light from darkness.<br>I am the will that draws peace from evil.<br>What I decree… becomes."</div>
<p>Six lives came into being, tethered to Their light. To Their boundless grace they bent the knee; by that grace alone they drew breath.</p>
</div>`
  },
  {
    nav: "II · Trinity",
    part: "Part Three",
    title: "Divine Trinity — The Seventh Decree",
    content: `
<div class="body-text">
<div class="decree">
"And it shall be written—<br>
not in ink, but in ruin—<br>
that a child shall rise from divided soul.<br><br>
Neither heaven shall hold Him,<br>
nor shall the abyss claim Him.<br>
For He will walk between—<br>
and the line shall break beneath His feet.<br><br>
The righteous shall not understand Him.<br>
The wicked shall not escape Him.<br>
And when His gaze falls upon creation,<br>
even the Throne shall remember fear.<br><br>
For this is the one born of light and fire—<br>
the end… and the beginning."
</div>
</div>`
  },
  {
    nav: "III · Salvation",
    part: "Part Seven — Acts I through IV",
    title: "Salvation",
    content: `
<div class="body-text">
<p><strong style="font-family:var(--font-sans);font-size:13px;letter-spacing:0.05em">ACT ONE</strong></p>
<p>Thousands of wings veiled Their throne — a sacred vessel of living light, bearing messages beyond mortal understanding.</p>
<p>Beyond the stroke of midnight, a star descended from the heavens. It took form. A graceful angel in the shape of a man — the only creation to pierce through Their light, the only creation to have once heard Their voice.</p>
<p>Within the garden, two humans shared quiet joy, unaware that a magnificent being watched over them. The Holy Tree stood at the garden's heart — forbidden, feared. And the message meant for humanity… was kept in reserve.</p>
<p>For another creation was about to be brought into existence. A formidable one.</p>
<p style="margin-top:2rem"><strong style="font-family:var(--font-sans);font-size:13px;letter-spacing:0.05em">ACT TWO</strong></p>
<p>Billions of whispers echoed through existence. A vessel was being chosen — one to complete Their creation. Among the highest, only one would be worthy. And for a single, suspended moment… all of creation fell still.</p>
<p>Then — from nothingness, Samael appeared, standing before Their gaze. A storm of wings veiled the Throne. And from the heavens descended Lucifer, keeper of forbidden knowledge — the mightiest of creations.</p>
<p>A distant voice wept like poetry across existence, as the Seraphim came to rest before Their Throne. A roar tore through reality itself — Michael spread his wings, vast enough to cover the skies.</p>
<p>And then, at last — the wings parted. Gabriel stepped forward… and bowed. The only one who had ever heard Their voice. The closest to Them.</p>
<p>At the center, a statue began to form before Them — the likeness of a son.</p>
<div class="dialogue"><span class="speaker">Lucifer</span>"To think… a God requires a son."</div>
<div class="dialogue"><span class="speaker">Samael</span>"To question the Divine is forbidden, Lucifer." <em>(steps forward, spear drawn)</em></div>
<p>Then something shifted. The universe trembled. Their hand moved. Their gaze had long been fixed upon the fire — the first spark of evil within creation. And now, They reached into it. From that fire, They drew forth something impossible — and shaped half a soul.</p>
<p>Suddenly — a scream. It tore through existence. The living bled. The heavens shook. The fire lost control. It surged outward, consuming all in its reach — only to collapse… into a single, trembling point.</p>
<p>From that trembling point, the angels felt it — death. In less than a heartbeat, it happened.</p>
<p>A supernova.</p>
<p>It consumed everything. The heavens were torn apart, the skies shattered, the land undone — even the fabric of existence itself was reduced to ruin.</p>
<p>And then… silence.</p>
<p>When the waves of destruction finally ceased, the angels turned toward the Throne. And there — for the first time — They saw it. Blood.</p>
<p>Unlike the lesser creations, They did not react. Their gaze did not waver. They reached out… and took the half-formed soul born of the fire, and placed it within the statue. By Their boundless grace — they bent the knee. By that grace alone, all drew breath.</p>
<p>From the fire, a new life emerged.</p>
<p>And because of what it was… Lucifer drew his weapon. He moved to strike — to end it before it could truly begin. But before the sin could be committed, Gabriel stepped forward — and shattered the weapon.</p>
<div class="dialogue"><span class="speaker">Gabriel</span>"Did the Father command you to kill?"</div>
<div class="dialogue"><span class="speaker">Lucifer</span>"To stop me is foolishness, young pigeon."</div>
<div class="dialogue"><span class="speaker">Gabriel</span>"Foolishness is this barbaric act. To raise your weapon before Their gaze, without Their will, is a sin worthy of death. But They are merciful. Return to your place. By the Father's command: this new life shall attend the birth of their Son."</div>
<p>Silence followed. Lucifer lowered his broken weapon, fury burning in his eyes — but he obeyed. The new life remained… awaiting the birth to come.</p>
<p style="margin-top:2rem"><strong style="font-family:var(--font-sans);font-size:13px;letter-spacing:0.05em">ACT THREE</strong></p>
<p>The six angels stood before Them, awaiting the chosen light. Many believed it would be Lucifer — the strongest, the wisest.</p>
<p>But — the chosen light was Gabriel.</p>
<p>A silence fell. Then it shattered.</p>
<div class="dialogue"><span class="speaker">Lucifer</span>"It should have been me! Not him! Why choose this weak, white pigeon?"</div>
<p>Shock rippled through the heavens. To question the Father's will… was unthinkable.</p>
<div class="dialogue"><span class="speaker">Samael</span>"Do you challenge the Father?"</div>
<div class="dialogue"><span class="speaker">Lucifer</span>"I am the keeper of Their knowledge! All of you are nothing. I am the strongest — the superior angel!"</div>
<div class="dialogue"><span class="speaker">Gabriel</span>"Enough. And that is why you were not chosen. You carry Their knowledge… yet you understand nothing. You mistake power for wisdom."</div>
<p>Fury ignited in Lucifer's eyes. He drew his weapon — but Their gaze shifted. And he stopped. Even he would not defy that.</p>
<div class="dialogue"><span class="speaker">Lucifer</span><em>(low, contemptuous)</em> "First Adam… now this son… and that woman born of fire. You are all blind. Even the one upon the Throne."</div>
<p>The heavens trembled.</p>
<div class="dialogue"><span class="speaker">Gabriel</span><em>(dangerously quiet)</em> "Watch. Your. Words."</div>
<div class="dialogue"><span class="speaker">Lucifer</span><em>(cold, certain)</em> "All of you are already dead. Because of that son… and that woman."</div>
<p>And with that — he turned, and vanished into the void.</p>
<p style="margin-top:2rem"><strong style="font-family:var(--font-sans);font-size:13px;letter-spacing:0.05em">ACT FOUR</strong></p>
<p>From the light of Gabriel, a soul was formed. It merged with the second half — the fragment born of fire and evil. And in that union, a great light was born.</p>
<p>The statue trembled… and life took hold within it.</p>
<p>Born of evil. Born of good. In the image of the Father —</p>
<p>the Messiah was born.</p>
</div>`
  },
  {
    nav: "IV · Corruption",
    part: "Part Thirteen",
    title: "Corruption",
    content: `
<div class="body-text">
<p>At first, it was not sound that marked the end — but silence.</p>
<p>The stars did not explode. They went out… one by one, like thoughts forgotten by existence itself.</p>
<p>Light stretched, twisted — then shattered. Galaxies unraveled into threads of fire, their spirals collapsing into nothingness, as though time itself had begun to rot.</p>
<p>Space tore open. Not cracked — torn, like fabric pulled too far. Through the wounds, there was no darkness — only absence.</p>
<p>Planets screamed without sound as they were unmade, their forms dissolving into dust, then into memory… then into nothing at all.</p>
<p>The heavens burned, the void trembled, and even eternity seemed to hesitate.</p>
<p>Laws broke. Gravity failed. Time stuttered — then collapsed. Moments repeated, then skipped, then ceased to exist.</p>
<p>And in the end — there was no explosion. It was not the work of one angel — but many. Countless lives were reaped. Lucifer rebelled.</p>
<p>Before Their Throne, the two stood — the eldest lights. Gabriel and Lucifer. Facing one another.</p>
<div class="dialogue"><span class="speaker">Gabriel</span>"The Father commands you to stop."</div>
<div class="dialogue"><span class="speaker">Lucifer</span>"I do not hear Him. Only you. Tell me, Gabriel… are those truly His words or yours?"</div>
<p>Gabriel gave no answer. Instead — he drew his weapon. The heavens trembled. Two lights of the Father, clashing against one another — and existence itself began to fracture.</p>
<p>Their power shook creation, tearing through sky and void alike. Until — one light began to fall. Gabriel fell to his knees.</p>
<p>Lucifer stepped toward him.</p>
<div class="dialogue"><span class="speaker">Lucifer</span>"Only if you had made me kill that serpent from the start, brother…"</div>
<p>His weapon rose — aimed at Gabriel's neck. Then — light fell from the Divine. It struck Lucifer. It burned him. The universe trembled.</p>
<p>And… They moved.</p>
<p>At the Father's command, light poured down upon all rebellion — every fallen angel was engulfed in divine fire. Yet Lucifer endured it. Not with darkness — but with light of his own. A defiant radiance rose against the Father's original flame. The sky shattered in brilliance.</p>
<p>The Father did not change Their gaze. His hand lowered. Lucifer's wings burned. His form fractured. His pride… broke.</p>
<p>When the light finally ceased, a wound remained in creation itself — a passage into endless depths.</p>
<p>And the Father spoke. Their voice was heard across all existence.</p>
<div class="decree">"Let there be Hell.<br>A reminder to those who would rebel.<br>My will is absolute.<br>My wrath is without end."</div>
<p>Gabriel lay wounded upon the ground. Beneath him, hell opened. And from within it… he heard it. The old angels' melody — turned into screams.</p>
<p>A hand reached Gabriel's shoulder.</p>
<div class="dialogue"><span class="speaker">Messiah</span>"Old friend, raise your head. It's all finished. Forgive and forget."</div>
</div>`
  },
  {
    nav: "V · Doubts",
    part: "Part Seventy-Five",
    title: "Doubts",
    content: `
<div class="body-text">
<div class="dialogue"><span class="speaker">Unknown Voice</span>"They say the rebellion was not born of pride alone…"</div>
<div class="dialogue"><span class="speaker">Seraphim</span>"Then speak it."</div>
<div class="dialogue"><span class="speaker">Angel of the Choir</span>"It began with her."</div>
<p><em>Silence spread through the heavens.</em></p>
<div class="dialogue"><span class="speaker">Angel of the Choir</span>"The woman… born of the fire."</div>
<div class="dialogue"><span class="speaker">Samael</span>"Be careful. Such words stain even thought."</div>
<div class="dialogue"><span class="speaker">Gabriel</span>"And yet… I have seen her. Or something like her."</div>
<div class="dialogue"><span class="speaker">Angel of the Choir</span>"Then you know. Adam fell because he followed her."</div>
<div class="dialogue"><span class="speaker">Gabriel</span>"I know only that he fell. The reason… is not something I was told to understand."</div>
<div class="dialogue"><span class="speaker">Seraphim</span>"And Lucifer's rebellion?"</div>
<div class="dialogue"><span class="speaker">Angel of the Choir</span>"It is said he saw her and questioned the design of creation itself."</div>
<div class="dialogue"><span class="speaker">Samael</span>"You speak as if rumor is truth."</div>
<div class="dialogue"><span class="speaker">Angel of the Choir</span>"In the absence of His voice… rumor becomes law."</div>
<div class="dialogue"><span class="speaker">Gabriel</span>"No. Not law. Only uncertainty."</div>
<div class="dialogue"><span class="speaker">Angel of the Choir</span>"Then what is she?"</div>
<div class="dialogue"><span class="speaker">Gabriel</span>"…I do not know."</div>
<p><em>For the first time, his certainty broke slightly.</em></p>
<div class="dialogue"><span class="speaker">Seraphim</span>"Then we should not speak of her at all."</div>
<div class="dialogue"><span class="speaker">Samael</span>"Agreed."</div>
<div class="dialogue"><span class="speaker">Seraphim</span>"For even divine uncertainty… becomes the seed of rebellion."</div>
</div>`
  },
  {
    nav: "VI · Dismantle",
    part: "Part One Hundred Ninety-Nine",
    title: "Dismantle",
    content: `
<div class="body-text">
<div class="dialogue"><span class="speaker">Seraphim</span>"The fire-born woman should not be spoken of. Her existence bends harmony."</div>
<div class="dialogue"><span class="speaker">Michael</span>"If she bends harmony, then she is a threat. I will end her if commanded."</div>
<div class="dialogue"><span class="speaker">Samael</span>"You would strike what you do not understand, Michael? That is not justice. That is impulse."</div>
<div class="dialogue"><span class="speaker">Michael</span>"And hesitation is how corruption spreads."</div>
<div class="dialogue"><span class="speaker">Metatron</span>"Silence. The records do not confirm her as creation… nor error. She is… undefined."</div>
<div class="dialogue"><span class="speaker">Gabriel</span>"…I have seen her shadow within the fire."</div>
<p><em>All eyes turned to him.</em></p>
<div class="dialogue"><span class="speaker">Seraphim</span>"Then speak clearly, Gabriel."</div>
<div class="dialogue"><span class="speaker">Gabriel</span>"I cannot. Because what I saw did not obey the shape of truth I was given."</div>
<div class="dialogue"><span class="speaker">Samael</span>"So even the closest to the Father admits uncertainty."</div>
<div class="dialogue"><span class="speaker">Gabriel</span>"I admit only what I know. And I do not know her purpose."</div>
<div class="dialogue"><span class="speaker">Metatron</span>"Purpose requires origin. Her origin is fire."</div>
<div class="dialogue"><span class="speaker">Michael</span>"Then fire is the enemy."</div>
<div class="dialogue"><span class="speaker">Seraphim</span>"Fire is also the beginning of light."</div>
<div class="dialogue"><span class="speaker">Samael</span>"And sometimes… the beginning of rebellion."</div>
<div class="dialogue"><span class="speaker">Gabriel</span><em>(quietly)</em> "Or the beginning of something we were never meant to name."</div>
<p><em>A heavy silence spread.</em></p>
<div class="dialogue"><span class="speaker">Metatron</span>"The Father has not spoken. Therefore, interpretation becomes division."</div>
<div class="dialogue"><span class="speaker">Seraphim</span>"And division becomes doubt."</div>
<div class="dialogue"><span class="speaker">Michael</span>"And doubt becomes war."</div>
<div class="dialogue"><span class="speaker">Gabriel</span>"…Or truth."</div>
<p><em>No one responds.</em></p>
<div class="dialogue"><span class="speaker">Samael</span>"Then we are already standing at the edge of it."</div>
<div class="dialogue"><span class="speaker">Metatron</span>"Record this moment. For when the Father speaks again… it may already be too late."</div>
</div>`
  },
  {
    nav: "VII · Crack",
    part: "Part Two Hundred",
    title: "Crack",
    content: `
<div class="body-text">
<div class="dialogue"><span class="speaker">Seraphim</span>"The balance has been broken. The Messiah has eaten from the Forbidden Tree."</div>
<div class="dialogue"><span class="speaker">Michael</span>"Then there is no debate. She must be erased before further corruption spreads."</div>
<div class="dialogue"><span class="speaker">Samael</span>"You speak as if consequence is simple. Who placed her there?"</div>
<div class="dialogue"><span class="speaker">Michael</span>"The one who led Him to sin."</div>
<div class="dialogue"><span class="speaker">Metatron</span>"Record states only this: the Messiah chose. Interference is unconfirmed."</div>
<div class="dialogue"><span class="speaker">Michael</span>"Do not hide behind records while creation burns."</div>
<div class="dialogue"><span class="speaker">Seraphim</span>"Her existence has already torn the pattern of grace."</div>
<div class="dialogue"><span class="speaker">Samael</span>"Or revealed that the pattern was never stable."</div>
<div class="dialogue"><span class="speaker">Michael</span>"Enough. I propose judgment. The woman born of fire will be eliminated."</div>
<p><em>Silence falls.</em></p>

<div class="dialogue"><span class="speaker">Samael</span>"Or rebellion."</div>
<div class="dialogue"><span class="speaker">Gabriel</span><em>(quietly)</em> "Or truth… we are not ready to understand."</div>
<p><em>A long silence.</em></p>
<div class="dialogue"><span class="speaker">Metatron</span>"No divine order has been given."</div>
<div class="dialogue"><span class="speaker">Seraphim</span>"Then the matter remains unresolved."</div>

<p>A voice descended gently from above. Gabriel looked up.</p>

<div class="dialogue"><span class="speaker">Messiah</span>"Long enough. Come. Sit with me."</div>
<p>At the highest peak of Heaven, the two sat together, watching the void stretch beneath creation. A long silence passed.</p>

<div class="body-text">
<p>From the sky, Gabriel looked down upon Heaven. Below him, the other angels were not at rest… nor in duty. They were armed. They were moving toward her. The woman. Their intent was clear — to kill her.</p>
<p>She ran. But there was nowhere left in creation for her to hide. Spear after spear tore through the air — until a star fell from the heavens.</p>
<p>And from its light… Gabriel descended.</p>
<p>He stood before her. The right hand of the Father.</p>
<div class="dialogue"><span class="speaker">Gabriel</span>"Is this your salvation? By killing a woman?"</div>
<div class="dialogue"><span class="speaker">Samael</span>"Move."</div>
<p>Gabriel did not step aside. His gaze shifted across them — Michael, Samael, Metatron, Seraphim… and the armies behind them.</p>
<div class="dialogue"><span class="speaker">Gabriel</span>"The Father's command is simple. Do not kill her."</div>
<div class="dialogue"><span class="speaker">Metatron</span>"You are lying. The Father's voice has been silent since the birth of Hell. He does not speak to save sinners — only to end them. We are doing His work."</div>
<div class="dialogue"><span class="speaker">Gabriel</span><em>(voice trembling)</em> "Then what is the difference between you… and Lucifer? If this is your definition of salvation, then you all deserve the Father's judgment."</div>
<p>He drew his weapon.</p>
<p>And in that moment — the strongest angel after Lucifer stood against Heaven itself.</p>
<p>The war began. A battle that tore through Heaven, and shook even Hell beneath it. Days passed.</p>
<p>When it ended… hundreds of angels lay broken across the skies — not dead… but unable to rise.</p>
<p>Only five remained standing. Gabriel — the fire-born woman behind him — and on the other side: Samael, Metatron, Seraphim, and Michael.</p>
<div class="dialogue"><span class="speaker">Gabriel</span><em>(laughing)</em> "Is that the best you can get?! …you need… more power."</div>
<p>The remaining angels hesitated — then lifted their weapons as one. Their light merged, becoming something vast… and blinding. A single, divine force — aimed at Gabriel. Gabriel did not move.</p>
<div class="dialogue"><span class="speaker">Gabriel</span>"Then I will show you… divine justice!"</div>
<p>He answered with light of his own — brighter, sharper, absolute. Two forces. Two truths. About to collide.</p>
<p>And then — someone stepped between them.</p>
<p>Messiah.</p>
<p>The light struck. All of it. Silence followed. The radiance faded… and he fell. Blood touched the ground of Heaven. His wings… turned to dust.</p>
<p>Messiah lay broken upon the ground. The dust of his wings drifted through Heaven — like the remains of something sacred… undone.</p>
<p>No one moved. Not Gabriel. Not Michael. Not even Samael. For the first time — Heaven was silent.</p>
<p>The woman born of fire stood still — shocked. Then the shock turned into anger. And the anger… became fire. Heaven felt it. Hell felt it. Heat spread across existence itself — not like flame, but like something far older. A fire unlike any known to creation.</p>
<p>Then — the Throne trembled. Not with rage. With presence.</p>
<p>Light did not fall. It descended. Not as fire — but as something older. Heavier. Absolute.</p>
<p>The Father had moved. And all of creation felt it. The void froze. Hell went still. Time itself bent inward — as if afraid to continue.</p>
<p>A voice followed. Not heard — but known.</p>
<div class="decree">"Enough."</div>
<p>The word alone shattered what remained of the sky. Gabriel fell to one knee. The others followed. Even those who still stood… could not remain standing.</p>
<div class="decree">"You speak of My will, yet you act without it. You name judgment… without understanding it. You sought salvation through destruction. You sought truth through defiance. You sought Me… in your own voices.<br><br>So you will learn."</div>
<p>The heavens split open. Not broken — divided. Light and fire tore apart from one another. The woman of fire was lifted — untouched. Gabriel could not reach her. None of them could.</p>
<div class="decree">"Judgment is not yours to carry. Nor is creation yours to correct.<br><br>Let Heaven remember doubt.<br>Let Hell remember pride."</div>

let cur = 0;

function render(){
  const ch = chapters[cur];
  document.getElementById('chapterArea').innerHTML = `
    <div class="part-label">${ch.part}</div>
    <h2 class="ch-title">${ch.title}</h2>
    ${ch.content}
    <div class="footer-nav">
      <button class="footer-btn" id="prevBtn" ${cur===0?'disabled':''} onclick="go(cur-1)">← Prev</button>
      <span class="ch-counter">CHAPTER ${cur+1} OF ${chapters.length}</span>
      <button class="footer-btn" id="nextBtn" ${cur===chapters.length-1?'disabled':''} onclick="go(cur+1)">Next →</button>
    </div>`;
  
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{
    b.classList.toggle('active', i===cur);
  });
  window.scrollTo({top:0, behavior: 'smooth'});
}

function go(i){
  cur = Math.max(0, Math.min(chapters.length-1, i));
  render();
}

// Init Nav Buttons
const nb = document.getElementById('navBtns');
chapters.forEach((ch,i)=>{
  const b = document.createElement('button');
  b.className='nav-btn';
  b.textContent = ch.nav;
  b.onclick = () => go(i);
  nb.appendChild(b);
});

render();

            },
            "interactivity": { "events": { "onhover": { "enable": false }, "onclick": { "enable": false } } },
            "retina_detect": true
        });
    }
});
